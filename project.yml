name: PolarMyFlow
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  swift: "5.9"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  PolarMyFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PolarMyFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.polarmyflow
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: PolarMyFlow/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - polarflow
            CFBundleURLName: com.personal.polarmyflow
        UILaunchStoryboardName: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Polar Data Export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
    dependencies:
      - sdk: SwiftData.framework
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
      - package: ZIPFoundation

  PolarMyFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PolarMyFlowTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.polarmyflowTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PolarMyFlow
      - package: ZIPFoundation
